name: Compilar APK Android

on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip python3-pip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libgl1-mesa-dev libgles2-mesa-dev ccache

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer==1.5.0

    - name: Accept Android Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build APK with Buildozer
      run: |
        unset ANDROID_NDK_ROOT
        unset ANDROID_NDK_HOME
        buildozer --warn_on_root=0 android debug

    - name: Prepare APK Artifact Path
      run: |
        mkdir -p bin
        find .buildozer -name "*.apk" -exec cp {} bin/ \; || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: App-Android-APK
        path: bin/*.apk
